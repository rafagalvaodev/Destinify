spring.application.name=backend
spring.profiles.active=dev
# Percentual escolhido para o requisito de grupos; o relatório não fixa um valor.
destinify.promotions.group-percentage=${PROMOTION_GROUP_PERCENTAGE:10}

# Porta do servidor. O Render informa a porta pela variável PORT.
server.port=${PORT:8080}

# Valores padrão para desenvolvimento local. Em produção o perfil "prod" exige as variáveis.
destinify.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
destinify.frontend-url=${FRONTEND_URL:http://localhost:5173}
destinify.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/login/google/autorizado}
destinify.jwt.secret=${JWT_SECRET:123456789}