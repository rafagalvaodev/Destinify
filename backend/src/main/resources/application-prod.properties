# Perfil de PRODUÇÃO. Ativado com a variável SPRING_PROFILES_ACTIVE=prod no Render.
# Aqui NÃO há valor padrão nos segredos: se faltar variável, o app não sobe (melhor que rodar errado).

# Banco (formato JDBC: jdbc:postgresql://HOST:5432/NOME_DO_BANCO)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.repair-on-migrate=false
spring.flyway.locations=classpath:db/migration

google.oauth.client.id=${GOOGLE_CLIENT_ID}
google.oauth.client.secret=${GOOGLE_CLIENT_SECRET}

# Sandbox por padrão. Para produção real, defina PAGBANK_BASE_URL=https://api.pagseguro.com
pagbank.base-url=${PAGBANK_BASE_URL:https://sandbox.api.pagseguro.com}
pagbank.token=${PAGBANK_TOKEN}
pagbank.redirect-url=${PAGBANK_REDIRECT_URL:}
pagbank.notification-url=${PAGBANK_NOTIFICATION_URL:}
pagbank.checkout-expiration-minutes=30
pagbank.webhook-public-key=${PAGBANK_WEBHOOK_PUBLIC_KEY:}

destinify.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
destinify.frontend-url=${FRONTEND_URL}
destinify.google.redirect-uri=${GOOGLE_REDIRECT_URI}
destinify.jwt.secret=${JWT_SECRET}