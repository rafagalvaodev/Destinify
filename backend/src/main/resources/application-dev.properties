spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration

google.oauth.client.id=${GOOGLE_CLIENT_ID}
google.oauth.client.secret=${GOOGLE_CLIENT_SECRET}

pagbank.base-url=https://sandbox.api.pagseguro.com
pagbank.token=${PAGBANK_TOKEN:}
pagbank.redirect-url=http://localhost:5173/pagamento/retorno
pagbank.notification-url=${PAGBANK_NOTIFICATION_URL:}
pagbank.checkout-expiration-minutes=30